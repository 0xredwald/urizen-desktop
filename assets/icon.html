<!doctype html>
<html>
<head><meta charset="utf-8" />
<style>
  html,body{margin:0;width:1024px;height:1024px;background:transparent;overflow:hidden}
  .wrap{position:absolute;inset:96px;border-radius:230px;
    background:radial-gradient(120% 100% at 50% 0%, #16180f 0%, #0b0c0a 55%, #070806 100%);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.06), inset 0 -40px 80px rgba(0,0,0,.5), 0 40px 80px rgba(0,0,0,.4);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .glow{position:absolute;width:620px;height:620px;border-radius:50%;
    background:radial-gradient(circle, rgba(52,240,3,.32), transparent 62%);filter:blur(6px)}
  svg{position:relative;width:360px;height:auto;filter:drop-shadow(0 0 34px rgba(52,240,3,.75))}
  .grid{position:absolute;inset:0;opacity:.05;
    background-image:linear-gradient(#34F003 1px,transparent 1px),linear-gradient(90deg,#34F003 1px,transparent 1px);
    background-size:64px 64px}
</style></head>
<body>
  <div class="wrap">
    <div class="grid"></div>
    <div class="glow"></div>
    <svg viewBox="0 0 580 696" fill="#34F003"><path d="M 456 696 L 318 558 L 178 696 L 0 517 L 2 166 L 180 0 L 182 453 L 276 546 L 278 166 L 458 1 L 458 453 L 580 574 Z"/></svg>
  </div>
</body>
</html>
