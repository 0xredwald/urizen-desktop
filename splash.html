<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; -webkit-user-select: none; }
  .card {
    position: absolute; inset: 10px; border-radius: 22px;
    background: radial-gradient(120% 100% at 50% 0%, #101012, #08080a 70%);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.7);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
    animation: rise .5s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise { from { opacity: 0; transform: scale(.96) translateY(6px); } to { opacity: 1; transform: none; } }
  .mark { width: 46px; height: 56px; filter: drop-shadow(0 0 18px rgba(52,240,3,.5)); animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .9 } 50% { opacity: .55 } }
  .name { color: #f4f4f5; font-size: 22px; font-weight: 700; letter-spacing: .04em; }
  .sub { color: #6b7280; font-size: 11px; text-transform: uppercase; letter-spacing: .22em; font-variant: small-caps; }
  .bar { width: 120px; height: 2px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 40%; background: #34F003; border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-120%) } 100% { transform: translateX(320%) } }
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 580 696" fill="#34F003"><path d="M 456 696 L 318 558 L 178 696 L 0 517 L 2 166 L 180 0 L 182 453 L 276 546 L 278 166 L 458 1 L 458 453 L 580 574 Z"/></svg>
    <div class="name">URIZEN</div>
    <div class="sub">booting the desk</div>
    <div class="bar"><i></i></div>
  </div>
</body>
</html>
